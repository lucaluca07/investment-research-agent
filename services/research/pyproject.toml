[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ira-research-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn",
  "duckdb",
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["research_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
